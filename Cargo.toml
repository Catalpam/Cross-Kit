[workspace]
resolver = "2"
members = [
    "crates/cross-kit",
    "crates/cross-kit-codegen",
    "crates/cross-kit-core",
    "crates/cross-kit-macros",
    "crates/cross-kit-packager-android",
    "crates/cross-kit-packager-ios",
    "crates/cross-kit-cli",
    "examples/counter-list/shared",
    "examples/minimal-counter/shared",
    "examples/form-wizard/shared",
    "examples/task-board/shared",
    "examples/shopping-cart/shared",
]
exclude = ["tools/ck-swift-packager"]

[workspace.package]
edition = "2024"
license = "MIT"
