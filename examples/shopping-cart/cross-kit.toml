[shared]
crate_path = "shared"
package = "shopping-cart-shared"
lib_name = "cross_kit_shopping_cart_shared"
metadata_bin = "ck_shopping_cart_metadata"

[bindings]
root_vm = "ShoppingCartViewModel"
container_name = "CrossKitShoppingCartBridge"

[ios]
package_name = "CrossKitShoppingCartShared"
output = "dist/ios"
targets = ["ios", "ios-sim", "ios-sim-x86_64"]
build_mode = "release"
lib_type = "static"
format = "spm"
swift_bridges = true

[android]
package_name = "com.crosskit.shoppingcart.shared"
output = "android/app/build/generated/cross-kit"
jni_libs_output = "dist/android/jniLibs"
package_output = "dist/android"
gradle_project_output = "dist/android/gradle-project"
module_name = "crosskitshoppingcartshared"
gradle_executable = "android/gradlew"
targets = ["arm64-v8a", "x86_64"]
build_mode = "release"

[android.maven]
group_id = "com.crosskit"
artifact_id = "crosskitshoppingcartshared"
version = "0.1.0"
