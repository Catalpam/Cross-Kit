[shared]
crate_path = "shared"
package = "form-wizard-shared"
lib_name = "cross_kit_form_wizard_shared"
metadata_bin = "ck_form_wizard_metadata"

[bindings]
root_vm = "FormWizardViewModel"
container_name = "CrossKitFormWizardBridge"

[ios]
package_name = "CrossKitFormWizardShared"
output = "dist/ios"
targets = ["ios", "ios-sim", "ios-sim-x86_64"]
build_mode = "release"
lib_type = "static"
format = "spm"
swift_bridges = true

[android]
package_name = "com.crosskit.formwizard.shared"
output = "android/app/build/generated/cross-kit"
jni_libs_output = "dist/android/jniLibs"
package_output = "dist/android"
gradle_project_output = "dist/android/gradle-project"
module_name = "crosskitformwizardshared"
gradle_executable = "android/gradlew"
targets = ["arm64-v8a", "x86_64"]
build_mode = "release"

[android.maven]
group_id = "com.crosskit"
artifact_id = "crosskitformwizardshared"
version = "0.1.0"
