[shared]
crate_path = "shared"
package = "task-board-shared"
lib_name = "cross_kit_task_board_shared"
metadata_bin = "ck_task_board_metadata"

[bindings]
root_vm = "TaskBoardViewModel"
container_name = "CrossKitTaskBoardBridge"

[ios]
package_name = "CrossKitTaskBoardShared"
output = "dist/ios"
targets = ["ios", "ios-sim", "ios-sim-x86_64"]
build_mode = "release"
lib_type = "static"
format = "spm"
swift_bridges = true

[android]
package_name = "com.crosskit.taskboard.shared"
output = "android/app/build/generated/cross-kit"
jni_libs_output = "dist/android/jniLibs"
package_output = "dist/android"
gradle_project_output = "dist/android/gradle-project"
module_name = "crosskittaskboardshared"
gradle_executable = "android/gradlew"
targets = ["arm64-v8a", "x86_64"]
build_mode = "release"

[android.maven]
group_id = "com.crosskit"
artifact_id = "crosskittaskboardshared"
version = "0.1.0"
