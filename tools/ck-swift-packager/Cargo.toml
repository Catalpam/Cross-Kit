[package]
name = "ck-swift-packager"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
camino = "1.1"
cargo_metadata = "0.19"
clap = { version = "4.5", features = ["derive"] }
cross-kit-codegen = { path = "../../crates/cross-kit-codegen" }
cross-kit-core = { path = "../../crates/cross-kit-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uniffi_bindgen = "0.29"
