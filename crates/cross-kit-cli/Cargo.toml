[package]
name = "cross-kit-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "cross-kit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
camino = "1.1"
cargo_metadata = "0.19"
clap = { version = "4.5", features = ["derive"] }
cross-kit-codegen = { path = "../cross-kit-codegen" }
cross-kit-core = { path = "../cross-kit-core" }
cross-kit-packager-ios = { path = "../cross-kit-packager-ios" }
serde_json = "1.0"
uniffi_bindgen = "0.29"
